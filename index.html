<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claudish 中文黑话 · 人话 → 黑话</title>
<style>
  :root {
    --accent: #1a73e8;
    --accent-dark: #1765cc;
    --bg: #f2f4f7;
    --card: #ffffff;
    --border: #dfe3e8;
    --text: #202124;
    --muted: #5f6368;
    --error: #d93025;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .icon-btn {
    background: none; border: none; cursor: pointer; font-size: 20px;
    color: var(--muted); padding: 6px; border-radius: 8px; line-height: 1;
  }
  .icon-btn:hover { background: #f1f3f4; color: var(--text); }

  main { flex: 1; display: flex; flex-direction: column; max-width: 1080px; width: 100%; margin: 0 auto; padding: 24px; gap: 16px; }
  .panes { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
  .pane {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .pane-head {
    padding: 10px 16px; font-size: 13px; color: var(--muted);
    border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
  }
  .pane-head b { color: var(--text); font-size: 14px; font-weight: 500; }
  .pane-body { flex: 1; display: flex; position: relative; }
  textarea, .output {
    width: 100%; border: none; outline: none; resize: none;
    font: 15px/1.7 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 16px; min-height: 340px;
  }
  textarea { background: transparent; }
  .output { overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .output:empty::before {
    content: "黑话会出现在这里"; color: #b5bac1; font-style: normal;
  }
  .pane-body .count {
    position: absolute; right: 10px; bottom: 8px; font-size: 12px; color: #b5bac1;
  }
  .swap-col { display: flex; align-items: center; }
  .arrow {
    font-size: 26px; color: var(--accent); background: #e8f0fe;
    width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }

  .toolbar { display: flex; align-items: center; gap: 12px; }
  .btn {
    border: none; border-radius: 8px; padding: 10px 22px; font-size: 15px; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 500;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn.ghost:hover { background: #f1f3f4; }
  .status { flex: 1; font-size: 13px; color: var(--muted); }
  .status.error { color: var(--error); }

  /* settings modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(32, 33, 36, .45);
    display: none; align-items: flex-start; justify-content: center; padding: 8vh 16px; z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--card); border-radius: 14px; width: 100%; max-width: 560px;
    padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.18);
  }
  .modal h2 { font-size: 18px; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font: 14px system-ui, "PingFang SC", sans-serif; outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field textarea { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12.5px; }
  .test-row { display: flex; align-items: center; gap: 10px; }
  .test-status { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .test-status.ok { color: #188038; }
  .test-status.err { color: var(--error); }
  details { margin-bottom: 14px; }
  summary { cursor: pointer; font-size: 13px; color: var(--accent); user-select: none; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 14px 0; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  .btn.plain { background: none; color: var(--accent); padding: 10px 14px; }
  .btn.plain:hover { background: #e8f0fe; }

  footer {
    padding: 14px 24px; font-size: 12px; color: var(--muted); text-align: center;
  }
  @media (max-width: 760px) {
    .panes { grid-template-columns: 1fr; }
    .swap-col { display: none; }
    textarea, .output { min-height: 200px; }
  }
</style>
</head>
<body>
<header>
  <h1>Claudish 中文黑话<span>人话 → 黑话 · 只做改写，不回复</span></h1>
  <button class="icon-btn" id="openSettings" title="设置">⚙</button>
</header>

<main>
  <div class="panes">
    <div class="pane">
      <div class="pane-head"><b>人话</b><span>输入</span></div>
      <div class="pane-body">
        <textarea id="input" placeholder="把大白话写在这里……&#10;例：发布要先通过所有测试，然后由负责人批准后才能上线。"></textarea>
        <span class="count" id="inputCount"></span>
      </div>
    </div>
    <div class="swap-col"><div class="arrow">→</div></div>
    <div class="pane">
      <div class="pane-head"><b>黑话</b><span id="outputMeta"></span></div>
      <div class="pane-body">
        <div class="output" id="output"></div>
        <span class="count" id="outputCount"></span>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn" id="translateBtn">翻译</button>
    <button class="btn ghost" id="clearBtn">清空</button>
    <div class="status" id="status">配置后即可翻译（⚙ 右上角）· Ctrl+Enter 快捷翻译</div>
  </div>
</main>

<footer>直连你填写的 OpenAI 兼容端点；密钥只存在本浏览器（localStorage），不经过任何服务器。</footer>

<!-- 设置 -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h2>接口设置</h2>
    <div class="field">
      <label>Base URL（OpenAI 兼容端点）</label>
      <input id="cfgBaseUrl" placeholder="https://api.openai.com/v1" spellcheck="false">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="cfgApiKey" type="password" placeholder="sk-..." spellcheck="false">
    </div>
    <div class="field">
      <label>模型</label>
      <input id="cfgModel" placeholder="gpt-4o-mini / deepseek-chat / qwen-plus 等" spellcheck="false">
    </div>
    <div class="field test-row">
      <button class="btn ghost" id="testConnBtn" type="button">测试连接</button>
      <span class="test-status" id="testStatus"></span>
    </div>
    <details>
      <summary>高级（提示词 / 采样参数）</summary>
      <div class="field-row">
        <div class="field"><label>Temperature</label><input id="cfgTemp" type="number" step="0.1" min="0" max="2"></div>
        <div class="field"><label>Max Tokens</label><input id="cfgMaxTokens" type="number" step="1" min="1"></div>
      </div>
      <div class="field">
        <label>系统提示词 <button class="btn plain" id="restorePrompt" title="恢复 prompt.js 里的蒸馏默认提示词" style="padding:0;font-size:12px">恢复默认</button></label>
        <textarea id="cfgPrompt" rows="10" spellcheck="false"></textarea>
      </div>
    </details>
    <div class="hint">
      支持任意 OpenAI 兼容供应商（OpenAI / DeepSeek / 通义 / 智谱 / vLLM / LM Studio…）。
      浏览器直连，需要供应商允许跨域（CORS）；若被拒，可后续加本地代理。
    </div>
    <div class="modal-actions">
      <button class="btn plain" id="closeSettings">取消</button>
      <button class="btn" id="saveSettings">保存</button>
    </div>
  </div>
</div>

<script src="prompt.js"></script>
<script>
(function () {
  "use strict";
  var LS_KEY = "claudish-zh:v1";
  var $ = function (id) { return document.getElementById(id); };

  var DEFAULT_SETTINGS = {
    baseUrl: "https://api.openai.com/v1",
    apiKey: "",
    model: "gpt-4o-mini",
    temperature: 0.7,
    maxTokens: 2000,
    prompt: window.CLAUDISH_ZH_PROMPT || ""
  };

  function loadSettings() {
    var s = DEFAULT_SETTINGS;
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) { var p = JSON.parse(raw); for (var k in s) if (typeof p[k] !== "undefined") s[k] = p[k]; }
    } catch (e) {}
    return s;
  }
  function saveSettings(s) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {}
  }

  var settings = loadSettings();
  $("input").addEventListener("input", function () {
    $("inputCount").textContent = this.value.length + " 字";
  });
  $("input").addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); translate(); }
  });

  $("clearBtn").addEventListener("click", function () {
    $("input").value = ""; $("output").textContent = ""; $("inputCount").textContent = ""; $("outputCount").textContent = "";
    setStatus("已清空。Ctrl+Enter 快捷翻译");
  });

  $("openSettings").addEventListener("click", openSettings);
  $("closeSettings").addEventListener("click", closeSettings);
  $("saveSettings").addEventListener("click", function () {
    settings.baseUrl = $("cfgBaseUrl").value.trim().replace(/\/+$/, "");
    settings.apiKey = $("cfgApiKey").value.trim();
    settings.model = $("cfgModel").value.trim();
    settings.temperature = parseFloat($("cfgTemp").value);
    settings.maxTokens = parseInt($("cfgMaxTokens").value, 10);
    settings.prompt = $("cfgPrompt").value;
    saveSettings(settings);
    closeSettings();
    setStatus("设置已保存到本浏览器");
  });
  $("restorePrompt").addEventListener("click", function (e) {
    e.stopPropagation();
    $("cfgPrompt").value = window.CLAUDISH_ZH_PROMPT || "";
  });
  $("testConnBtn").addEventListener("click", testConnection);

  // 连接探测：先 GET /models（零 token，验证 URL+Key）；供应商没实现该端点
  // 就降级为一次 max_tokens=1 的最小对话（约 0 成本）。
  function testConnection() {
    var base = $("cfgBaseUrl").value.trim().replace(/\/+$/, "");
    var key = $("cfgApiKey").value.trim();
    var model = $("cfgModel").value.trim();
    if (!base) { connStatus("先填 Base URL", false); return; }
    if (!key) { connStatus("先填 API Key", false); return; }

    var btn = $("testConnBtn");
    btn.disabled = true; btn.textContent = "测试中…";
    connStatus("正在探测 " + base + " …", null);

    function done(ok, msg) {
      btn.disabled = false; btn.textContent = "测试连接";
      connStatus(msg, ok);
    }

    var ac = new AbortController();
    var t = setTimeout(function () { ac.abort(); }, 15000);

    fetch(base + "/models", { headers: { Authorization: "Bearer " + key }, signal: ac.signal })
      .then(function (r) {
        if (r.ok) {
          return r.json().catch(function () { return {}; }).then(function (d) {
            var names = (d.data || []).map(function (m) { return m.id; }).slice(0, 3);
            done(true, "连通，Key 有效。端点示例模型：" + (names.join(" / ") || "（列表为空）"));
          });
        }
        throw new Error("models:" + r.status);
      })
      .catch(function (err) {
        clearTimeout(t);
        if (err && err.name === "AbortError") { done(false, "探测超时（15s）——检查地址与网络"); return; }
        if (err && String(err.message).indexOf("models:") !== 0) {
          done(false, "请求被浏览器拦截（CORS）或网络不通——供应商需允许跨域，否则得加本地代理");
          return;
        }
        if (!model) { done(false, "/models 不可用（HTTP " + err.message.split(":")[1] + "），且模型名没填——填上模型再测"); return; }
        // 降级：最小对话
        var ac2 = new AbortController();
        var t2 = setTimeout(function () { ac2.abort(); }, 20000);
        fetch(base + "/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
          body: JSON.stringify({ model: model, max_tokens: 1, messages: [{ role: "user", content: "hi" }] }),
          signal: ac2.signal
        }).then(function (r2) {
          clearTimeout(t2);
          return r2.json().catch(function () { return {}; }).then(function (d2) {
            if (r2.ok) done(true, "连通（最小对话），模型 " + model + " 可用");
            else done(false, "返回 HTTP " + r2.status + " — " + ((d2.error && (d2.error.message || JSON.stringify(d2.error))) || "空错误体"));
          });
        }).catch(function (e2) {
          clearTimeout(t2);
          if (e2 && e2.name === "AbortError") { done(false, "对话探测超时（20s）"); return; }
          done(false, "请求被浏览器拦截（CORS）或网络不通");
        });
      });
  }

  function connStatus(msg, ok) {
    var el = $("testStatus");
    el.textContent = msg;
    el.className = "test-status" + (ok === true ? " ok" : ok === false ? " err" : "");
  }

  function openSettings() {
    $("testStatus").textContent = ""; $("testStatus").className = "test-status";
    $("cfgBaseUrl").value = settings.baseUrl;
    $("cfgApiKey").value = settings.apiKey;
    $("cfgModel").value = settings.model;
    $("cfgTemp").value = settings.temperature;
    $("cfgMaxTokens").value = settings.maxTokens;
    $("cfgPrompt").value = settings.prompt;
    $("settingsOverlay").classList.add("show");
  }
  function closeSettings() {
    $("settingsOverlay").classList.remove("show");
  }
  $("settingsOverlay").addEventListener("click", function (e) { if (e.target === this) closeSettings(); });

  function setStatus(msg, isError) {
    var el = $("status");
    el.textContent = msg;
    el.className = "status" + (isError ? " error" : "");
  }

  function translate() {
    var text = $("input").value.trim();
    if (!text) { setStatus("先输入人话", true); return; }
    if (!settings.apiKey) { setStatus("还没有配 API Key：右上角 ⚙ 填写你的 OpenAI 兼容接口", true); openSettings(); return; }
    if (!settings.model) { setStatus("没有填模型名", true); openSettings(); return; }

    var btn = $("translateBtn");
    btn.disabled = true; btn.textContent = "翻译中…";
    setStatus("正在调用 " + settings.model + " …");
    $("output").textContent = "";

    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 120000);

    fetch(settings.baseUrl + "/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + settings.apiKey
      },
      body: JSON.stringify({
        model: settings.model,
        temperature: settings.temperature,
        max_tokens: settings.maxTokens,
        messages: [
          { role: "system", content: settings.prompt },
          { role: "user", content: text }
        ]
      }),
      signal: controller.signal
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          var msg = (data && data.error && (data.error.message || JSON.stringify(data.error))) || ("HTTP " + res.status);
          throw new Error(msg);
        }
        return data;
      });
    }).then(function (data) {
      var out = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (!out) throw new Error("响应里没有内容（choices[0].message.content 为空）");
      $("output").textContent = out.replace(/\s+$/, "");
      $("outputMeta").textContent = settings.model;
      $("outputCount").textContent = out.length + " 字";
      setStatus("完成");
    }).catch(function (err) {
      var msg = err && err.name === "AbortError" ? "请求超时（120s）。检查 Base URL / Key / 模型是否可访问" : (err.message || String(err));
      setStatus(msg, true);
    }).finally(function () {
      clearTimeout(timer);
      btn.disabled = false; btn.textContent = "翻译";
    });
  }
  $("translateBtn").addEventListener("click", translate);
})();
</script>
</body>
</html>
